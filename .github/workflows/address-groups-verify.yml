name: Validate native address-count groups
on:
  push:
    branches: [codex/address-count-groups]
    paths:
      - .github/workflows/address-groups-verify.yml
      - .github/address-groups.patch.gz
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Apply checked source patch
        run: |
          git diff --exit-code 5457ea856dddb8cce5e08698ef313b13624b1b1b -- liquid_tracer tests docs
          python3 - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          raw = gzip.decompress(Path('.github/address-groups.patch.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == '0cc8da668f0704676f245280ee7f623eb6daabaf562ba554615d9fe0a646e06f', 'Patch integrity mismatch'
          path = Path('/tmp/address-groups.patch')
          path.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/address-groups.patch.gz .github/workflows/address-groups-source.yml .github/workflows/address-groups-verify.yml
          git diff --cached --check
      - name: Install offline test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
      - name: Verify native grouping, recovery and snapshot publication
        run: .venv/bin/python -m unittest tests.test_miro_address_groups tests.test_miro_recovery_cli tests.test_connections tests.test_branch_interactions -v
      - name: Run full offline regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Publish verified source to feature branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Group address circles with their transaction-count labels in Miro'
          git push origin HEAD:refs/heads/codex/address-count-groups
