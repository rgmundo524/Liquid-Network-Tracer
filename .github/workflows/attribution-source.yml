name: Prepare attribution test workspace
on:
  push:
    branches: [codex/attribution-hop-limits]
    paths: [.github/workflows/attribution-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b31e7e2f53d8826c4918d94bd052d2cc99dac533
      - run: git archive HEAD > /tmp/attribution-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attribution-source
          path: /tmp/attribution-source.tar
          retention-days: 2
