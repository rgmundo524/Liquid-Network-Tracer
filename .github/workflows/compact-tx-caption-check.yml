name: Validate compact TX caption
on:
  push:
    branches: [codex/compact-tx-caption]
    paths: [.github/workflows/compact-tx-caption-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Shorten the shared caption and update its expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          path = Path('liquid_tracer/address_counts.py')
          raw = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '97caf14e3a35d78a219a72df618006e53c36a328'
          text = raw.decode('utf-8')
          assert text.count('return "TX count: " + label(node)') == 1
          path.write_text(text.replace('return "TX count: " + label(node)', 'return "TX: " + label(node)'))
          for name in subprocess.check_output(['git', 'ls-files', 'tests', 'docs'], text=True).splitlines():
              path = Path(name)
              if path.suffix not in ('.py', '.md'):
                  continue
              text = path.read_text()
              if 'TX count:' in text:
                  path.write_text(text.replace('TX count:', 'TX:'))
          path = Path('tests/test_inline_address_counts.py')
          text = path.read_text()
          anchor = '    def test_dry_run_is_offline_and_never_changes_legacy_group_state(self):\n'
          assert text.count(anchor) == 1
          method = '''    def test_long_inline_caption_refreshes_in_place_without_grouping(self):
                  old = make_plan(self.graph)
                  for shape in old['shapes']:
                      content = shape['body']['data']['content']
                      shape['body']['data']['content'] = content.replace('<p>TX: ', '<p>TX count: ')
                  old['sha256'] = digest(canonical({k: v for k, v in old.items() if k != 'sha256'}))
                  self.send(old)
                  before = read_json(self.path)
                  ids = {key: item['id'] for key, item in before['items'].items()}
                  self.assertTrue(all('TX count: 1,234' in self.remote.items[ids[n['id']]]['data']['content']
                                      for n in self.addresses))
                  node = self.addresses[0]
                  self.remote.items[ids[node['id']]]['position'].update(x=7000, y=-300)
                  self.remote.calls.clear()
                  result = self.send(max_items=0)
                  self.assertEqual(result['created'], 0)
                  self.assertEqual(result['deleted'], 0)
                  self.assertEqual(ids, {key: item['id'] for key, item in read_json(self.path)['items'].items()})
                  for node in self.addresses:
                      content = self.remote.items[ids[node['id']]]['data']['content']
                      self.assertTrue(content.endswith('</a></p><p>TX: 1,234</p>'))
                      self.assertNotIn('TX count:', content)
                  self.assertEqual(self.remote.items[ids[self.addresses[0]['id']]]['position']['x'], 7000)
                  self.assertFalse(any('/groups' in call[1] for call in self.remote.calls))
                  writes = len(self.remote.writes)
                  self.send(max_items=0)
                  self.assertEqual(len(self.remote.writes), writes)

          '''
          # Normalize the embedded method's body to ordinary class indentation.
          method = method.replace('\n                  ', '\n        ').replace('\n                                      ', '\n                            ')
          method = method.rstrip() + '\n\n'
          path.write_text(text.replace(anchor, method + anchor))
          PY
          git rm .github/workflows/compact-tx-caption-check.yml
          git add liquid_tracer/address_counts.py tests docs
          git diff --cached --check
          git diff --cached --stat
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
      - name: Check caption, renderers, migration, and refresh without grouping
        run: |
          .venv/bin/python -m unittest tests.test_inline_address_counts tests.test_address_count_labels tests.test_automatic_address_counts tests.test_presentation_annotations tests.test_miro_sync tests.test_mermaid tests.test_layout_preview tests.test_service_presentation tests.test_presentation_refresh tests.test_layout_reuse -v
      - name: Publish checked source on feature branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Shorten inline address transaction counts to TX'
          git push origin HEAD:refs/heads/codex/compact-tx-caption
