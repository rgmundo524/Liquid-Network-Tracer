name: Prepare starter connection test workspace
on:
  push:
    branches: [codex/starter-connections]
    paths: [.github/workflows/connection-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Prepare tracked source and offline test dependencies
        run: |
          mkdir -p /tmp/connection-workspace/wheels
          git archive --format=tar HEAD > /tmp/connection-workspace/source.tar
          python3 -m pip download 'textual==8.2.8' -d /tmp/connection-workspace/wheels
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
          tar -czf /tmp/connection-workspace/layout-deps.tar.gz layout/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connection-workspace
          path: /tmp/connection-workspace/
          retention-days: 1
