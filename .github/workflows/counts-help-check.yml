name: Check automatic count help consistency
on:
  push:
    branches: [codex/automatic-address-counts]
    paths: [.github/workflows/counts-help-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Correct obsolete offline-only descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(filename, old, new):
              path = Path(filename)
              text = path.read_text()
              assert text.count(old) == 1, (filename, old)
              path.write_text(text.replace(old, new))
          change('liquid_tracer/cli.py', 'Regenerate a run export without network calls',
                 'Regenerate a run export, fetching missing address transaction counts')
          change('liquid_tracer/cli.py', 'Create a local Mermaid chart from a saved run without API calls',
                 'Create a local Mermaid chart, fetching missing address transaction counts')
          change('liquid_tracer/cli.py', 'Optimize a saved graph locally with ELK and export HTML/SVG without API calls',
                 'Fetch missing address counts, then optimize locally with ELK and export HTML/SVG')
          change('liquid_tracer/menu.py', 'Compact graph (offline preview)', 'Compact graph (local preview)')
          change('liquid_tracer/menu.py', 'Create an offline compact comparison to review before applying it to Miro.',
                 'Create a local compact comparison; missing address counts are fetched automatically.')
          change('docs/starter-connections.md',
                 'unchanged. It does not start another blockchain search or use Blockstream credits.',
                 'unchanged. Path selection uses saved evidence and does not retrace transactions.\nMissing transaction counts for displayed addresses are fetched automatically;\nthese statistics requests can use Blockstream credits. See [automatic address\ncounts](automatic-address-counts.md). An empty connection graph makes no requests.')
          change('docs/development.md', 'The offline demo trace, navigation, and local previews need no credentials.',
                 'The offline demo trace and navigation need no credentials. Previews fetch missing address counts automatically and use SecretSpec when those lookups require Enterprise credentials; cached/public-API counts need no provider session.')
          change('docs/development.md',
                 '**ELK layout preview** uses the selected saved run and current display settings to calculate an arrangement without contacting a secret provider or any API.',
                 '**ELK layout preview** uses the selected saved run and current display settings. Missing address transaction counts are fetched first, with Enterprise credentials when needed; ELK placement itself remains a local calculation.')
          change('docs/development.md',
                 '**Mermaid chart** creates a local preview from the latest verified run without opening the secret provider.',
                 '**Mermaid chart** creates a local preview from the latest verified run, fetching missing address counts first and opening the secret provider only when Enterprise lookups require it.')
          change('docs/development.md', 'Opening the browser and performing local actions do not resolve secrets.',
                 'Opening the browser, reading saved evidence and exporting transaction CSVs do not resolve secrets. Generating a chart can require credentials for automatic missing-address-count lookups.')
          change('README.md',
                 'Regenerating a preview or syncing to Miro uses existing saved evidence and makes no extra explorer requests.',
                 'Unspent status uses existing saved evidence. Separately, previews and ordinary Miro sync automatically fetch any missing address transaction counts before rendering.')
          change('README.md', 'This offline action saves `graph.html`, `graph.svg`, `graph.json`, and `layout-report.json`',
                 'This action fetches missing address transaction counts, computes placement locally, and saves `graph.html`, `graph.svg`, `graph.json`, and `layout-report.json`')
          change('README.md',
                 'Opening a link is the only action that contacts the explorer. Saved previews remain self-contained and render offline.',
                 'Preview generation can contact the statistics API for missing address counts. Once saved, previews remain self-contained and render offline; opening an Explorer link is a separate browser request. See [automatic address counts](docs/automatic-address-counts.md).')
          PY
          git rm .github/workflows/counts-help-check.yml
          git add README.md docs liquid_tracer
          git diff --cached --check
      - name: Check help and focused integration tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
          .venv/bin/python -m liquid_tracer --help
          .venv/bin/python -m unittest tests.test_automatic_address_counts tests.test_elk_workflows -v
      - name: Publish checked help cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Describe automatic statistics lookups in chart help and documentation'
          git push origin HEAD:refs/heads/codex/automatic-address-counts
