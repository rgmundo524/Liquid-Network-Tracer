name: Validate asset-aware transaction CSV
on:
  push:
    branches: [codex/transaction-csv-assets]
    paths: [.github/csv-asset-update.py, .github/workflows/csv-asset-check.yml, tests/test_transaction_csv_assets.py]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Apply exact CSV schema changes
        run: |
          python3 .github/csv-asset-update.py
          git rm .github/csv-asset-update.py .github/workflows/csv-asset-check.yml
          git add liquid_tracer/transaction_csv.py tests/test_transaction_csv.py tests/test_transaction_csv_assets.py tests/test_csv_export.py tests/test_service_presentation.py docs/transaction-csv.md
          git diff --cached --check
      - name: Install regression test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
      - name: Verify asset identification and CSV contracts
        run: .venv/bin/python -m unittest tests.test_transaction_csv_assets tests.test_transaction_csv tests.test_csv_export tests.test_csv_cli tests.test_service_presentation tests.test_connections_ui -v
      - name: Run full offline regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Publish verified source to feature branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Revise transaction CSV columns and include explicit asset identity'
          git push origin HEAD:refs/heads/codex/transaction-csv-assets
