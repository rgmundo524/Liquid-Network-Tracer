name: Verify actual address-count group membership
on:
  push:
    branches: [codex/verified-address-groups]
    paths:
      - .github/group-verification.patch.b64
      - .github/workflows/group-verification-check.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Apply exact tested source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(Path('.github/group-verification.patch.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7b46e0f16fff4a2a8cb43b65e7a9695e62615cdfabf1e6b5ee91f2c4621d0b8a'
          Path('/tmp/group-verification.patch').write_bytes(raw)
          PY
          git apply --check /tmp/group-verification.patch
          git apply /tmp/group-verification.patch
          git rm .github/group-verification.patch.b64 .github/workflows/group-verification-check.yml
          git add liquid_tracer tests docs
          git diff --cached --check
      - name: Install offline regression dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
      - name: Verify membership, repair and existing grouping regressions
        run: .venv/bin/python -m unittest tests.test_miro_group_verification tests.test_miro_address_groups tests.test_miro_sync tests.test_address_count_labels -v
      - name: Run full offline regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Publish validated code on feature branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify live address-count group membership and repair stale acknowledgements'
          git push origin HEAD:refs/heads/codex/verified-address-groups
