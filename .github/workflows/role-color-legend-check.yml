name: Validate palette-aware Mermaid legend
on:
  push:
    branches: [codex/role-color-palette]
    paths: [.github/workflows/role-color-legend-check.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Retain the selected event color in the preview legend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('liquid_tracer/mermaid.py')
          text = path.read_text()
          old = '    legend[1] = "Pink diamonds: events. Arrows show the direction of UTXO links."'
          new = '    legend[1] = legend[1].split(". ", 1)[0] + ". Arrows show the direction of UTXO links."'
          assert text.count(old) == 1, 'Unexpected Mermaid legend'
          path.write_text(text.replace(old, new))
          path = Path('tests/test_role_colors.py')
          text = path.read_text()
          old = '        source = mermaid_source(graph)\n'
          new = ('        from liquid_tracer.mermaid import _preview_html\n'
                 '        preview = _preview_html(graph, render_svg(graph))\n'
                 '        self.assertIn(palette["event"] + " diamonds: events.", preview)\n'
                 '        self.assertNotIn("Pink diamonds: events.", preview)\n'
                 '        self.assertIn("Pink diamonds: events.", _preview_html(original, render_svg(original)))\n'
                 '        source = mermaid_source(graph)\n')
          assert text.count(old) == 1, 'Unexpected role-rendering test'
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/role-color-legend-check.yml
          git add liquid_tracer/mermaid.py tests/test_role_colors.py
          git diff --cached --check
      - name: Install offline test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
      - name: Run role-color and Mermaid rendering regressions
        run: .venv/bin/python -m unittest tests.test_role_colors tests.test_mermaid tests.test_branch_interactions -v
      - name: Publish verified legend correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep custom event colors in Mermaid preview legends'
          git push origin HEAD:refs/heads/codex/role-color-palette
