name: Validate name colors and seed priority
on:
  push:
    branches: [codex/protonpass-development]
    paths: [.github/workflows/seed-color-development.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Apply and verify tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'a5e33c169c259a8150c843cfa16e25fdd0312a16', 'Development branch changed; reconcile before applying'
          chunks = []
          for sha in (
              '3f0d4b88a089214c82a5165d53e1098cd71cb5c4',
              'c04c7c9dcb306f05a072d619ccd7d2307b3ab168',
              '0ff613fcbc2bc3eca3ede8f479cb98d4950b025e',
          ):
              request = urllib.request.Request(
                  'https://api.github.com/repos/rgmundo524/Liquid-Network-Tracer/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              chunks.append(base64.b64decode(blob['content']).decode('ascii'))
          patch = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd275a421fe947fa91a37ae70c7023dcd761528c853f4bf1162cb4fef2c828d79'
          Path('/tmp/name-colors.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '/tmp/name-colors.patch'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/seed-color-development.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '37ac6b9374e0aab870a21be806042d5318b07d77', 'Final source differs from tested implementation'
          PY
      - name: Run full offline regression suite
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
          npm --prefix layout ci --ignore-scripts --no-audit --no-fund
          .venv/bin/python -m unittest discover -s tests -v
      - name: Check and build browser interface
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run check
          npm --prefix web run build
      - name: Publish to existing development branch
        run: |
          test "$(git write-tree)" = 37ac6b9374e0aab870a21be806042d5318b07d77
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assign case-insensitive name colors and prioritize selected seed red'
          git push origin HEAD:refs/heads/codex/protonpass-development
