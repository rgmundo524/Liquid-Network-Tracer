name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the terminal interface
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[tui]'
      - name: Run offline tracing and Textual interface tests
        run: .venv/bin/python -m unittest discover -s tests -v
