[project]
name = "liquid-network-tracer"
revision = "1.0"

# Names and descriptions are public. Values live in each developer's provider.
# Commands check the credentials they need: tracing needs Blockstream, while
# Miro sync needs only MIRO_ACCESS_TOKEN. Offline commands need none of these.
[profiles.default]
BLOCKSTREAM_CLIENT_ID = { description = "Blockstream Explorer API client ID", required = false }
BLOCKSTREAM_CLIENT_SECRET = { description = "Blockstream Explorer API client secret", required = false }
MIRO_ACCESS_TOKEN = { description = "Miro token with boards:read and boards:write access", required = false }

# The devenv launchers select development explicitly. Keep default available
# for existing users and commands that do not select a profile.
[profiles.development]
BLOCKSTREAM_CLIENT_ID = { description = "Blockstream Explorer API client ID", required = false }
BLOCKSTREAM_CLIENT_SECRET = { description = "Blockstream Explorer API client secret", required = false }
MIRO_ACCESS_TOKEN = { description = "Miro token with boards:read and boards:write access", required = false }
